  <text x="736" y="857" fill="#c6b783" font-family="Georgia, serif" font-size="37" font-style="italic" font-weight="bold">iEast</text>
  <text x="736" y="879" fill="#a79c72" font-family="Arial, sans-serif" font-size="9" letter-spacing="2">DIRECT DRIVE · 33⅓ RPM</text>
