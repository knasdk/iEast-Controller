  <rect x="1066" y="534" width="44" height="46" rx="2" fill="#000" opacity=".65" transform="translate(2 5)"/>
  <rect x="1066" y="534" width="42" height="44" rx="2" fill="url(#slider)" stroke="#8c8d83" stroke-width="2"/>
  <path d="M1068 547h38m-38 13h38m-38 9h38" stroke="#373a32" stroke-width="2"/>
  <rect x="1041" y="621" width="7" height="7" rx="1" fill="#e0a345"/>
  <g fill="#a59d71" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" opacity=".85">
