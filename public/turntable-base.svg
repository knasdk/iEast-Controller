  <circle cx="465" cy="450" r="429" fill="#0c0d0b" stroke="url(#rim)" stroke-width="3"/>
  <ellipse cx="663" cy="794" rx="137" ry="96" fill="url(#warmLight)"/>

  <circle cx="75" cy="710" r="43" fill="#0c0d0a" stroke="#090a08" stroke-width="5"/>
