<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="904" viewBox="0 0 1200 904">
  <defs>
    <linearGradient id="wood" x2="1" y2="1">
      <stop stop-color="#302c26"/>
      <stop offset=".42" stop-color="#1c1a17"/>
      <stop offset="1" stop-color="#25221d"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".19 .004" numOctaves="3" seed="12"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <radialGradient id="vignette">
      <stop offset=".35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="rim" x2=".8" y2="1">
      <stop stop-color="#b7ab8d"/>
      <stop offset=".2" stop-color="#4a4538"/>
      <stop offset=".5" stop-color="#151513"/>
      <stop offset=".8" stop-color="#90856c"/>
      <stop offset="1" stop-color="#3c382f"/>
    </linearGradient>
    <radialGradient id="metal" cx=".32" cy=".2" r=".85">
      <stop stop-color="#5d5a50"/>
      <stop offset=".42" stop-color="#20201d"/>
      <stop offset=".8" stop-color="#0d0e0c"/>
      <stop offset="1" stop-color="#3b382f"/>
    </radialGradient>
    <linearGradient id="brass">
      <stop stop-color="#393124"/>
      <stop offset=".24" stop-color="#a49266"/>
      <stop offset=".45" stop-color="#f1e4b1"/>
      <stop offset=".64" stop-color="#a19066"/>
      <stop offset="1" stop-color="#433a29"/>
    </linearGradient>
    <linearGradient id="slider" x2="0" y2="1">
      <stop stop-color="#d5d4cc"/>
      <stop offset=".18" stop-color="#66665e"/>
      <stop offset=".35" stop-color="#eeeeea"/>
      <stop offset=".55" stop-color="#8f9088"/>
      <stop offset=".76" stop-color="#e8e8e3"/>
      <stop offset="1" stop-color="#51524c"/>
    </linearGradient>
    <radialGradient id="warmLight">
      <stop stop-color="#f6c064" stop-opacity=".35"/>
      <stop offset="1" stop-color="#d88a2d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path fill="url(#wood)" d="M0 0h1200v904H0z"/>
  <path fill="#6b6150" opacity=".1" filter="url(#grain)" d="M0 0h1200v904H0z"/>
  <path fill="url(#vignette)" d="M0 0h1200v904H0z"/>

  <!-- The fixed gimbal and arm rest sit below the independently moving arm. -->
  <circle cx="976" cy="239" r="163" fill="#080908" stroke="#39372f" stroke-width="3"/>
  <circle cx="976" cy="239" r="155" fill="url(#metal)" stroke="url(#rim)" stroke-width="7"/>
  <circle cx="976" cy="239" r="111" fill="#0b0c0a" stroke="#3b3b33" stroke-width="4"/>
