name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: windows-executables
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Prepare development filenames
        if: github.ref == 'refs/heads/master'
        run: |
          mv dist/*.AppImage dist/iEast-Controller-Development-x86_64.AppImage
          mv dist/iEast-Controller-Setup-*.exe dist/iEast-Controller-Development-Setup-x64.exe
          mv dist/iEast-Controller-Portable-*.exe dist/iEast-Controller-Development-Portable-x64.exe
      - run: sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "iEast Controller $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Publish development release
        if: github.ref == 'refs/heads/master'
        run: |
          gh release delete development --cleanup-tag --yes || true
          gh release create development dist/* --target "$GITHUB_SHA" --prerelease --title "iEast Controller Development" --notes "Automatisk build ${GITHUB_RUN_NUMBER} fra master (${GITHUB_SHA::7})."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
